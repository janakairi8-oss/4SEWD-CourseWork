<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Add Watch</title>

<link rel="stylesheet" href="AddWatch.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

<h2><i class="fa-solid fa-clock"></i> Imperial Watches</h2>

<nav>
<a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
<a href="Watches.html"><i class="fa-regular fa-clock"></i> Watches</a>
<a href="Suppliers.html"><i class="fa-solid fa-user-group"></i> Suppliers</a>
<a href="AddWatch.html"><i class="fa-solid fa-circle-plus"></i> Add Watch</a>
<a href="Logout.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</nav>

</header>

<div class="container">

<h1>Add New Watch</h1>

<form>

<label>Watch Name</label>
<input type="text" placeholder="Enter Watch Name">

<label>Brand</label>
<select>
<option>Select Brand</option>
<option>Rolex</option>
<option>Casio</option>
<option>Apple</option>
<option>Fossil</option>
<option>Omega</option>
<option>Tissot</option>
<option>Seiko</option>
<option>Titan</option>
<option>Citizen</option>
<option>Timex</option>
</select>

<label>Price</label>
<input type="number" placeholder="Enter Price">

<label>Stock</label>
<input type="number" placeholder="Enter Stock Quantity">

<label>Supplier</label>
<input type="text" placeholder="Enter Supplier Name">

<label>Watch Image</label>
<input type="file">

<button type="submit">Add Watch</button>

</form>

</div>

<footer>

<p>© 2026 Imperial Watches. All Rights Reserved.</p>

</footer>

</body>

</html>
